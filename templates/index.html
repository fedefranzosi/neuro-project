<!doctype html>
<html>
<head>
  <title>Patient Form</title>
</head>
<body>
  <h1>Patient Form</h1>
  <form method="post">
    <label>Name: <input name="name" required></label><br>
    <label>Age: <input type="number" name="age" required min="0"></label><br>
    <label>Notes:<br><textarea name="notes"></textarea></label><br>
    <button type="submit">Submit</button>
  </form>
  <h2>Existing Patients</h2>
  <ul>
    {% for p in patients %}
      <li>{{ p.name }} ({{ p.age }}) - {{ p.notes }}</li>
    {% endfor %}
  </ul>
</body>
</html>
