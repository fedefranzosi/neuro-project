<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Patient Intake Form</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <h1 class="mb-4">Formulario de Pacientes</h1>
  <form method="post" class="mb-5">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Nombre</label>
        <input class="form-control" name="first_name" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Apellido</label>
        <input class="form-control" name="last_name" required>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">DNI</label>
        <input class="form-control" name="dni" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Fecha de nacimiento</label>
        <input type="date" class="form-control" name="birth_date" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Fecha de ingreso</label>
        <input type="date" class="form-control" name="admission_date" required>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Obra social</label>
      <input class="form-control" name="health_insurance">
    </div>
    <div class="mb-3">
      <label class="form-label">Motivo de consulta</label>
      <textarea class="form-control" name="reason" rows="2"></textarea>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha de inicio de síntomas</label>
        <input type="date" class="form-control" name="symptom_start">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">HPO</label>
        <input class="form-control" name="hpo">
      </div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="diagnosed" id="diagnosed">
      <label class="form-check-label" for="diagnosed">Diagnóstico</label>
    </div>
    <div class="mb-3">
      <label class="form-label">¿Qué diagnóstico?</label>
      <input class="form-control" name="diagnosis">
    </div>
    <div class="mb-3">
      <label class="form-label">Video (link)</label>
      <input type="url" class="form-control" name="video_url">
    </div>
    <div class="mb-3">
      <label class="form-label">Link a estudios complementarios</label>
      <input type="url" class="form-control" name="studies_link">
    </div>
    <button type="submit" class="btn btn-primary">Enviar</button>
  </form>
  <h2 class="mb-3">Pacientes existentes</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>DNI</th>
        <th>Fecha ingreso</th>
        <th>Diagnóstico</th>
      </tr>
    </thead>
    <tbody>
      {% for p in patients %}
      <tr>
        <td>{{ p.first_name }}</td>
        <td>{{ p.last_name }}</td>
        <td>{{ p.dni }}</td>
        <td>{{ p.admission_date }}</td>
        <td>{{ p.diagnosis }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
