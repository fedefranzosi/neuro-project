version: '3'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: patients
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      MYSQL_DATABASE: patients
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_HOST: db
    depends_on:
      - db
volumes:
  db_data:
